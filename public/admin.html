<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Portfolio Admin</title><link rel="stylesheet" href="style.css"><style>
.admin-wrap{width:min(1050px,calc(100% - 36px));margin:50px auto}.admin-panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;margin:18px 0}.admin-panel h2{font:600 22px var(--display);margin:0 0 16px}.admin-form{display:grid;gap:12px}.admin-form input,.admin-form textarea{width:100%;background:#0c1427;border:1px solid var(--line);border-radius:8px;padding:12px;color:white;font:14px var(--font)}.admin-form label{font-size:12px;color:var(--muted)}.admin-form button,.admin-action{border:0;border-radius:8px;padding:11px 16px;background:linear-gradient(100deg,#8b7cf6,#5dcde2);color:#091120;font-weight:700;cursor:pointer}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.admin-list{display:grid;gap:10px}.admin-row{padding:14px;border:1px solid var(--line);border-radius:10px;display:flex;justify-content:space-between;gap:12px;align-items:center}.admin-row p{margin:3px 0;color:var(--muted);font-size:12px}.danger{background:#7f1d35;color:#fff}.admin-meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:12px}.admin-status{color:#6ee7b7}.hidden{display:none!important}.admin-message{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);font-size:13px}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:15px}.admin-top h1{font:700 32px var(--display)}@media(max-width:700px){.admin-grid{grid-template-columns:1fr}.admin-row{align-items:flex-start;flex-direction:column}.admin-top{align-items:flex-start;flex-direction:column}}
</style></head><body><header class="site-header"><nav class="nav wrap"><a class="logo" href="/">YN<span>.</span></a><a href="/">← View website</a></nav></header><main class="admin-wrap"><section class="admin-panel" id="loginPanel"><p class="eyebrow">PRIVATE AREA</p><h1>Admin sign in</h1><p class="hero-text">Sign in with your administrator password.</p><form class="admin-form" id="loginForm"><label for="adminPassword">Admin password</label><input id="adminPassword" type="password" autocomplete="current-password" required><button type="submit">Sign in securely →</button><p id="loginStatus" role="status"></p></form></section><section id="dashboard" class="hidden"><div class="admin-top"><div><p class="eyebrow">CONTROL CENTER</p><h1>Portfolio dashboard</h1></div><button class="admin-action danger" id="logoutButton">Log out</button></div><div class="admin-panel"><div class="admin-meta"><span>Status: <b class="admin-status" id="activityStatus">Active</b></span><span>Session ends: <b id="sessionExpiry">—</b></span><span>Idle timeout: 15 minutes</span><span>Maximum session: 1 hour</span></div><p id="dashboardStatus" role="status"></p></div><div class="admin-grid"><section class="admin-panel"><h2>Add a project</h2><form id="projectForm" class="admin-form"><label>Project title<input name="title" maxlength="120" required></label><label>Description<textarea name="description" rows="3" maxlength="1200" required></textarea></label><label>Technologies (comma separated)<input name="tech" placeholder="HTML, CSS, JavaScript"></label><label>Live demo URL<input name="link" type="url"></label><label>GitHub URL<input name="github" type="url"></label><label><input name="featured" type="checkbox"> Featured project</label><button type="submit">Save project</button><p id="projectStatus" role="status"></p></form></section><section class="admin-panel"><h2>Projects</h2><div id="adminProjects" class="admin-list">Loading…</div></section></div><section class="admin-panel"><h2>Contact messages</h2><div id="adminMessages" class="admin-list">Loading…</div></section></section></main><script>
const $=id=>document.getElementById(id);let sessionExpiresAt=0,lastInteraction=Date.now(),heartbeatTimer=null;
async function api(url,options={}){const response=await fetch(url,{credentials:'same-origin',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});let body={};try{body=await response.json()}catch{}if(!response.ok)throw new Error(body.error||'Request failed');return body}
function showLogin(message=''){ $('loginPanel').classList.remove('hidden');$('dashboard').classList.add('hidden');$('loginStatus').textContent=message; if(heartbeatTimer)clearInterval(heartbeatTimer);}
function showDashboard(data){$('loginPanel').classList.add('hidden');$('dashboard').classList.remove('hidden');sessionExpiresAt=data.sessionExpiresAt||0;$('sessionExpiry').textContent=sessionExpiresAt?new Date(sessionExpiresAt).toLocaleTimeString(): '—';loadAdminData();startHeartbeat();if(!sessionExpiresAt)api('/api/admin/status').then(status=>{sessionExpiresAt=status.sessionExpiresAt;$('sessionExpiry').textContent=new Date(sessionExpiresAt).toLocaleTimeString()}).catch(()=>showLogin('Your session has expired. Please sign in again.'));}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginStatus').textContent='Signing in…';try{const result=await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('adminPassword').value})});$('adminPassword').value='';showDashboard(result)}catch(err){$('loginStatus').textContent=err.message}});
$('logoutButton').addEventListener('click',async()=>{try{await api('/api/admin/logout',{method:'POST',body:'{}'})}catch{}showLogin('You have been logged out.')});
function noteActivity(){lastInteraction=Date.now();$('activityStatus').textContent='Active'}['pointerdown','keydown','touchstart','scroll'].forEach(evt=>document.addEventListener(evt,noteActivity,{passive:true}));
function startHeartbeat(){if(heartbeatTimer)clearInterval(heartbeatTimer);heartbeatTimer=setInterval(async()=>{const active=Date.now()-lastInteraction<5*60*1000;try{const data=await api('/api/admin/heartbeat',{method:'POST',body:JSON.stringify({active})});sessionExpiresAt=data.sessionExpiresAt;$('sessionExpiry').textContent=new Date(sessionExpiresAt).toLocaleTimeString();$('activityStatus').textContent=active?'Active':'Idle'}catch(err){showLogin('Your session has expired. Please sign in again.')}},60000)}
async function loadAdminData(){try{const [projects,messages]=await Promise.all([api('/api/projects'),api('/api/messages')]);$('adminProjects').innerHTML=projects.length?projects.map(p=>`<article class="admin-row"><div><b>${esc(p.title)}</b><p>${esc(p.description)}</p></div><button class="admin-action danger" data-delete="${esc(p._id)}">Delete</button></article>`).join(''):'<p>No projects yet.</p>';$('adminMessages').innerHTML=messages.length?messages.map(m=>`<article class="admin-row"><div><b>${esc(m.name)} · ${esc(m.email)}</b><p>${new Date(m.createdAt).toLocaleString()}</p><div class="admin-message">${esc(m.message)}</div></div></article>`).join(''):'<p>No messages yet.</p>'}catch(err){$('dashboardStatus').textContent=err.message;if(err.message.toLowerCase().includes('login'))showLogin(err.message)}}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('adminProjects').addEventListener('click',async e=>{const button=e.target.closest('[data-delete]');if(!button)return;if(!confirm('Delete this project?'))return;try{await api('/api/projects/'+encodeURIComponent(button.dataset.delete),{method:'DELETE',body:'{}'});await loadAdminData()}catch(err){$('dashboardStatus').textContent=err.message}});
$('projectForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const payload={title:f.get('title'),description:f.get('description'),tech:String(f.get('tech')||'').split(',').map(x=>x.trim()).filter(Boolean),link:f.get('link'),github:f.get('github'),featured:f.get('featured')==='on'};try{await api('/api/projects',{method:'POST',body:JSON.stringify(payload)});e.currentTarget.reset();$('projectStatus').textContent='Project saved.';await loadAdminData()}catch(err){$('projectStatus').textContent=err.message}});
api('/api/admin/status').then(showDashboard).catch(()=>showLogin());
</script></body></html>
